name: Buscar Notícias (apenas tickers com contexto)

on:
  # Execução manual
  workflow_dispatch:
  
  # Agendado: dias úteis às 12:00 UTC (9:00 Brasília)
  schedule:
    - cron: '0 12 * * 1-5'

permissions:
  contents: read

jobs:
  buscar-noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache dependências
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Listar tickers com contexto disponível
        run: |
          echo "Tickers com contexto:"
          ls -la src/contexts/*.json 2>/dev/null | wc -l
          ls src/contexts/*.json 2>/dev/null | head -20 || echo "Nenhum contexto encontrado"
      
      - name: Executar busca de notícias
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT_REGISTRY_API_KEY: ${{ secrets.EVENT_REGISTRY_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          REMETENTE_EMAIL: ${{ secrets.REMETENTE_EMAIL }}
          REMETENTE_SENHA: ${{ secrets.REMETENTE_SENHA }}
        run: |
          python main.py --only-with-context
