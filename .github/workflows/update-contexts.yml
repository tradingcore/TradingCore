name: Update Business Contexts

on:
  schedule:
    # Roda todo dia 1 do mês às 00:00 UTC
    - cron: '0 0 1 * *'
  
  # Permite execução manual
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contexts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependências
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Atualizar Contextos
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python src/scripts/update_all_contexts.py
      
      - name: Commit e Push das mudanças
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/contexts/*.txt || true
          git diff --staged --quiet || git commit -m "Update business contexts [automated]"
          git push || true
