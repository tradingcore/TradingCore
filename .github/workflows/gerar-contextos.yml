name: Gerar Contextos das Ações

on:
  workflow_dispatch:  # Rodar manualmente

jobs:
  gerar-contextos:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Gerar contextos via releases CVM
        run: python src/scripts/gerar_contextos_releases.py
      
      - name: Commit e Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/contexts/*.json
          git diff --staged --quiet || git commit -m "feat: Contextos das ações via releases CVM"
          git pull --rebase origin main
          git push
