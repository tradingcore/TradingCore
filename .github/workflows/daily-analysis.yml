name: TradingCore - Análise Diária

on:
  schedule:
    # Roda todos os dias às 12:00 UTC (9:00 AM Brasília)
    - cron: '0 12 * * *'
  
  # Permite execução manual
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-send:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependências
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Executar análise diária
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT_REGISTRY_API_KEY: ${{ secrets.EVENT_REGISTRY_API_KEY }}
          REMETENTE_EMAIL: ${{ secrets.REMETENTE_EMAIL }}
          REMETENTE_SENHA: ${{ secrets.REMETENTE_SENHA }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python main.py
      
      - name: Commit e Push de novos contextos
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/contexts/*.txt || true
          git diff --staged --quiet || git commit -m "Salva novos contextos gerados [automated]"
          git push || true
