name: Atualizar Cotações

on:
  # Roda a cada 15 minutos durante o pregão (10h-18h BRT = 13h-21h UTC)
  schedule:
    # Minuto 0, 15, 30, 45 de cada hora, das 13h às 21h UTC (10h-18h BRT)
    - cron: '0,15,30,45 13-21 * * 1-5'  # Seg-Sex
  
  # Permite rodar manualmente
  workflow_dispatch:

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install yfinance firebase-admin pytz

      - name: Atualizar cotações
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "
import os
import json
import yfinance as yf
from datetime import datetime
import pytz
import firebase_admin
from firebase_admin import credentials, firestore

# Inicializar Firebase
cred_json = os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON')
if not cred_json:
    print('❌ FIREBASE_SERVICE_ACCOUNT_JSON não configurado')
    exit(1)

cred = credentials.Certificate(json.loads(cred_json))
firebase_admin.initialize_app(cred)
db = firestore.client()

tz = pytz.timezone('America/Sao_Paulo')
now = datetime.now(tz)
print(f'🕐 Atualizando cotações: {now.strftime(\"%d/%m/%Y %H:%M\")}')

# ========================================
# 1. Cotações de mercado
# ========================================
MARKET_TICKERS = {
    '^BVSP': 'IBOV',
    'USDBRL=X': 'Dólar',
    'EURBRL=X': 'Euro',
    'GC=F': 'Ouro',
    'BTC-USD': 'Bitcoin'
}

print('\n📊 Cotações de mercado:')
quotes = {}

for symbol, name in MARKET_TICKERS.items():
    try:
        ticker = yf.Ticker(symbol)
        hist = ticker.history(period='2d')
        
        if not hist.empty and len(hist) >= 1:
            price = float(hist['Close'].iloc[-1])
            
            if len(hist) >= 2:
                prev = float(hist['Close'].iloc[-2])
                change = price - prev
                change_pct = (change / prev) * 100
            else:
                change = 0
                change_pct = 0
            
            quotes[symbol] = {
                'price': price,
                'change': round(change, 4),
                'changePercent': round(change_pct, 2),
                'name': name,
                'updatedAt': now.isoformat()
            }
            print(f'  ✓ {name}: {price:.2f} ({change_pct:+.2f}%)')
    except Exception as e:
        print(f'  ✗ {name}: {e}')

if quotes:
    db.collection('market_data').document('quotes').set(quotes, merge=True)
    print(f'  → {len(quotes)} cotações salvas')

# ========================================
# 2. Cotações B3 (tickers dos usuários)
# ========================================
print('\n📈 Coletando tickers dos usuários...')
all_tickers = set()

for doc in db.collection('users').stream():
    data = doc.to_dict() or {}
    tickers = data.get('tickers', [])
    if isinstance(tickers, list):
        for t in tickers:
            if t and str(t).strip():
                all_tickers.add(str(t).strip().upper())

print(f'  → {len(all_tickers)} tickers únicos: {sorted(all_tickers)}')

if all_tickers:
    print('\n💹 Cotações B3:')
    b3_quotes = {}
    
    for ticker in sorted(all_tickers):
        try:
            ticker_yahoo = f'{ticker}.SA'
            stock = yf.Ticker(ticker_yahoo)
            hist = stock.history(period='2d')
            
            if not hist.empty and len(hist) >= 1:
                price = float(hist['Close'].iloc[-1])
                
                if len(hist) >= 2:
                    prev = float(hist['Close'].iloc[-2])
                    change = price - prev
                    change_pct = (change / prev) * 100
                else:
                    change = 0
                    change_pct = 0
                
                b3_quotes[ticker] = {
                    'price': round(price, 2),
                    'change': round(change, 2),
                    'changePercent': round(change_pct, 2),
                    'updatedAt': now.isoformat()
                }
                print(f'  ✓ {ticker}: R\$ {price:.2f} ({change_pct:+.2f}%)')
        except Exception as e:
            print(f'  ✗ {ticker}: {e}')
    
    if b3_quotes:
        db.collection('market_data').document('b3_quotes').set(b3_quotes, merge=True)
        print(f'  → {len(b3_quotes)} cotações B3 salvas')

print('\n✅ Atualização concluída!')
"
